name: Build Android APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Android platform 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager tidak ditemukan"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pastikan gradlew executable
        run: chmod +x gradlew

      - name: Siapkan google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Menggunakan GOOGLE_SERVICES_JSON dari GitHub Secrets."
          elif [ -f "gradle/firebase-google-services.json" ]; then
            cp gradle/firebase-google-services.json app/google-services.json
            echo "::warning::Secret GOOGLE_SERVICES_JSON belum diisi; menggunakan fallback gradle/firebase-google-services.json."
          else
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "santoya-offline-build",
              "storage_bucket": "santoya-offline-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": {
                    "package_name": "com.aistudio.santoyaro.kxmpzq"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-dummy.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "::warning::Secret GOOGLE_SERVICES_JSON belum diisi; membangun APK dengan konfigurasi Firebase dummy (mode offline)."
            {
              echo "### Perhatian: Konfigurasi Firebase Fallback"
              echo ""
              echo "Secret \`GOOGLE_SERVICES_JSON\` belum diisi di **Settings > Secrets and variables > Actions**."
              echo "APK debug tetap dibangun menggunakan konfigurasi fallback agar artefak siap diuji secara offline."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
